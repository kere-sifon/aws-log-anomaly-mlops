name: ML pipeline (SageMaker)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "training/**"
      - "pipeline/**"
  workflow_dispatch:
    inputs:
      force_retrain:
        description: Optional flag recorded as a pipeline execution tag
        required: false
        default: false
        type: boolean

concurrency:
  group: ml-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}

jobs:
  sast-python:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bandit
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "bandit[toml]>=1.7.0"

      - name: Run Bandit on pipeline / training / inference
        run: |
          set -euo pipefail
          # -ll: report medium+ severity only (reduces noise). Remove -ll to include low.
          bandit -r training pipeline inference -ll -f txt

  trigger-pipeline:
    name: Trigger SageMaker pipeline
    needs:
      - sast-python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      pipeline_execution_arn: ${{ steps.start.outputs.pipeline_execution_arn || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Wait for Terraform workflow (mixed infra + ML commits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Not a push event; skip waiting for Terraform."
            exit 0
          fi

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            FILES=$(git diff --name-only HEAD~1 HEAD)
          else
            FILES=$(git ls-tree -r --name-only HEAD)
          fi

          HAS_TF=false
          HAS_ML=false
          echo "$FILES" | grep -q '^terraform/' && HAS_TF=true || true
          echo "$FILES" | grep -qE '^(training|pipeline)/' && HAS_ML=true || true

          if [ "$HAS_TF" != "true" ] || [ "$HAS_ML" != "true" ]; then
            echo "Commit does not change both terraform/ and training|pipeline/; skip Terraform wait."
            exit 0
          fi

          echo "Mixed infra + ML commit: waiting for Terraform workflow to succeed before SageMaker steps."
          SHA="${GITHUB_SHA}"

          for i in $(seq 1 120); do
            JSON=$(curl -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=50")

            STATUS=$(echo "$JSON" | jq -r --arg path ".github/workflows/infra.yml" \
              '[.workflow_runs[] | select(.path == $path)] | sort_by(.created_at) | reverse | .[0] |
              if . == null then "none" else .status end')
            CONCLUSION=$(echo "$JSON" | jq -r --arg path ".github/workflows/infra.yml" \
              '[.workflow_runs[] | select(.path == $path)] | sort_by(.created_at) | reverse | .[0] |
              if . == null then "none" else (.conclusion // "") end')

            echo "Poll $i/120: Terraform workflow status=${STATUS} conclusion=${CONCLUSION}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Terraform workflow succeeded."
                exit 0
              fi
              echo "Terraform workflow finished without success (conclusion=${CONCLUSION}). Aborting ML pipeline."
              exit 1
            fi

            sleep 30
          done

          echo "Timed out waiting for Terraform workflow."
          exit 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Install boto3 and sagemaker
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "boto3>=1.34.0,<2" "sagemaker>=2.220.0,<3"

      - name: Upsert pipeline definition
        env:
          SAGEMAKER_ROLE_ARN: ${{ vars.SAGEMAKER_EXECUTION_ROLE_ARN || secrets.SAGEMAKER_EXECUTION_ROLE_ARN }}
          SAGEMAKER_DEFAULT_BUCKET: ${{ vars.SAGEMAKER_DEFAULT_BUCKET || secrets.SAGEMAKER_DEFAULT_BUCKET }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          role = (os.environ.get("SAGEMAKER_ROLE_ARN") or "").strip()
          if not role:
              print(
                  "::notice title=Skipping SageMaker upsert::Set Actions variable or secret "
                  "SAGEMAKER_EXECUTION_ROLE_ARN to your SageMaker execution role ARN (from Terraform)."
              )
              sys.exit(0)
          from pipeline.definition import build_pipeline
          pipe = build_pipeline(role)
          pipe.upsert(role_arn=role)
          PY

      - name: Start pipeline execution
        id: start
        env:
          SAGEMAKER_ROLE_ARN: ${{ vars.SAGEMAKER_EXECUTION_ROLE_ARN || secrets.SAGEMAKER_EXECUTION_ROLE_ARN }}
          PIPELINE_NAME: ${{ vars.SAGEMAKER_PIPELINE_NAME || 'log-anomaly-detection-pipeline' }}
          MODEL_PACKAGE_GROUP_NAME: ${{ vars.MODEL_PACKAGE_GROUP_NAME }}
          FORCE_RETRAIN: ${{ github.event.inputs.force_retrain || 'false' }}
        run: |
          python3 - <<'PY'
          import os
          import boto3

          role = (os.environ.get("SAGEMAKER_ROLE_ARN") or "").strip()
          if not role:
              print(
                  "::notice title=Skipping SageMaker pipeline start::Set Actions variable or secret "
                  "SAGEMAKER_EXECUTION_ROLE_ARN to enable pipeline execution."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("pipeline_execution_arn=\n")
              raise SystemExit(0)

          region = os.environ["AWS_DEFAULT_REGION"]
          name = os.environ["PIPELINE_NAME"]
          sm = boto3.client("sagemaker", region_name=region)

          params = []
          mpg = os.environ.get("MODEL_PACKAGE_GROUP_NAME") or ""
          if mpg.strip():
              params.append({"Name": "ModelPackageGroupName", "Value": mpg})

          fr = os.environ.get("FORCE_RETRAIN") or "false"
          tags = [
              {"Key": "GitHubRepository", "Value": os.environ.get("GITHUB_REPOSITORY", "")},
              {"Key": "GitHubRunId", "Value": os.environ.get("GITHUB_RUN_ID", "")},
              {"Key": "force_retrain", "Value": str(fr)},
          ]

          kwargs = {
              "PipelineName": name,
              "PipelineExecutionDisplayName": f"gha-{os.environ.get('GITHUB_RUN_ID', 'local')}",
              "Tags": tags,
          }
          if params:
              kwargs["PipelineParameters"] = params

          resp = sm.start_pipeline_execution(**kwargs)
          arn = resp["PipelineExecutionArn"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"pipeline_execution_arn={arn}\n")
          print("Started:", arn)
          PY

  wait-for-pipeline:
    name: Wait for pipeline execution
    if: ${{ needs.trigger-pipeline.outputs.pipeline_execution_arn != '' }}
    runs-on: ubuntu-latest
    needs: trigger-pipeline
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Poll pipeline status (60s interval, max 30 min)
        env:
          PIPELINE_EXECUTION_ARN: ${{ needs.trigger-pipeline.outputs.pipeline_execution_arn }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time
          import boto3

          arn = os.environ["PIPELINE_EXECUTION_ARN"]
          region = os.environ["AWS_DEFAULT_REGION"]
          sm = boto3.client("sagemaker", region_name=region)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          fail_states = {"Failed", "Stopped"}
          final = None

          for i in range(30):
              d = sm.describe_pipeline_execution(PipelineExecutionArn=arn)
              status = d["PipelineExecutionStatus"]
              line = f"Poll {i + 1}/30: {status}\n"
              print(line, end="")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write(line)
              if status == "Succeeded":
                  final = status
                  break
              if status in fail_states:
                  final = status
                  break
              time.sleep(60)

          if final is None:
              msg = "Timed out after 30 minutes waiting for pipeline execution."
              print(msg)
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write(f"### Final status\n\n{msg}\n")
              sys.exit(1)

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(f"### Final pipeline status\n\n**{final}**\n")

          if final in fail_states:
              sys.exit(1)
          PY

  approve-and-deploy:
    name: Approve model package and update endpoint
    runs-on: ubuntu-latest
    needs:
      - trigger-pipeline
      - wait-for-pipeline
    if: ${{ needs.wait-for-pipeline.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Approve latest model package and deploy to endpoint
        id: deploy
        env:
          MODEL_PACKAGE_GROUP_NAME: ${{ vars.MODEL_PACKAGE_GROUP_NAME }}
          SAGEMAKER_ENDPOINT_NAME: ${{ vars.SAGEMAKER_ENDPOINT_NAME }}
          SAGEMAKER_EXECUTION_ROLE_ARN: ${{ vars.SAGEMAKER_EXECUTION_ROLE_ARN }}
          SAGEMAKER_INFERENCE_INSTANCE_TYPE: ${{ vars.SAGEMAKER_INFERENCE_INSTANCE_TYPE || 'ml.t2.medium' }}
          PIPELINE_EXECUTION_ARN: ${{ needs.trigger-pipeline.outputs.pipeline_execution_arn }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          import sys

          import boto3

          region = os.environ["AWS_DEFAULT_REGION"]
          group = (os.environ.get("MODEL_PACKAGE_GROUP_NAME") or "").strip()
          endpoint_name = (os.environ.get("SAGEMAKER_ENDPOINT_NAME") or "").strip()
          exec_role = (os.environ.get("SAGEMAKER_EXECUTION_ROLE_ARN") or "").strip()
          instance_type = os.environ["SAGEMAKER_INFERENCE_INSTANCE_TYPE"]
          pe_arn = os.environ.get("PIPELINE_EXECUTION_ARN", "")

          if not group or not endpoint_name or not exec_role:
              print(
                  "Set GitHub repository variables: MODEL_PACKAGE_GROUP_NAME, "
                  "SAGEMAKER_ENDPOINT_NAME, SAGEMAKER_EXECUTION_ROLE_ARN"
              )
              sys.exit(1)

          sm = boto3.client("sagemaker", region_name=region)
          gh_run = os.environ.get("GITHUB_RUN_ID", "manual")

          lst = sm.list_model_packages(
              ModelPackageGroupName=group,
              ModelApprovalStatus="PendingManualApproval",
              SortBy="CreationTime",
              SortOrder="Descending",
              MaxResults=10,
          )
          summaries = lst.get("ModelPackageSummaryList") or []
          if not summaries:
              lst = sm.list_model_packages(
                  ModelPackageGroupName=group,
                  SortBy="CreationTime",
                  SortOrder="Descending",
                  MaxResults=1,
              )
              summaries = lst.get("ModelPackageSummaryList") or []

          if not summaries:
              print("No model packages found in group:", group)
              sys.exit(1)

          mp_arn = summaries[0]["ModelPackageArn"]
          sm.update_model_package(ModelPackageArn=mp_arn, ModelApprovalStatus="Approved")

          pkg = sm.describe_model_package(ModelPackageArn=mp_arn)
          inf = pkg["InferenceSpecification"]["Containers"][0]
          container = {"Image": inf["Image"], "ModelDataUrl": inf["ModelDataUrl"]}
          if inf.get("Environment"):
              container["Environment"] = inf["Environment"]

          model_name = f"log-anomaly-gh-{gh_run}"
          sm.create_model(
              ModelName=model_name,
              PrimaryContainer=container,
              ExecutionRoleArn=exec_role,
          )

          cfg_name = f"log-anomaly-epcfg-{gh_run}"
          sm.create_endpoint_config(
              EndpointConfigName=cfg_name,
              ProductionVariants=[
                  {
                      "VariantName": "primary",
                      "ModelName": model_name,
                      "InitialInstanceCount": 1,
                      "InstanceType": instance_type,
                  }
              ],
          )

          sm.update_endpoint(EndpointName=endpoint_name, EndpointConfigName=cfg_name)

          ts = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Approve and deploy",
              "",
              f"- **Model package ARN**: `{mp_arn}`",
              f"- **Endpoint name**: `{endpoint_name}`",
              f"- **Pipeline execution ARN**: `{pe_arn}`",
              f"- **Timestamp (UTC)**: {ts}",
              "",
          ]
          text = "\n".join(lines)
          print(text)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(text + "\n")
          PY
